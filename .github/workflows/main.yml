name: Build BINGO-ET APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-and-build:
    name: verify-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Verify project structure
        run: |
          echo "=== android/ contents ==="
          ls -la android/
          echo "=== src/ contents ==="
          ls -la src/
          test -f android/settings.gradle  test -f android/settings.gradle.kts  (echo "ERROR: settings.gradle missing in android/" && exit 1)

      - name: Build Full Debug APK
        run: |
          cd android
          gradle clean assembleDebug --stacktrace

      - name: Verify APK contents
        run: |
          APK_PATH=$(find android -path "*/build/outputs/apk/debug/*.apk" | head -n 1)
          echo "Built APK: $APK_PATH"
          test -n "$APK_PATH" && test -f "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          unzip -l "$APK_PATH" | head -n 60

      - name: Upload BINGO-ET APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BINGO-ET-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
