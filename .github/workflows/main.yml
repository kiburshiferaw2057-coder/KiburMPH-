name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project root
        shell: bash
        run: |
          pwd
          ls -la
          test -f pubspec.yaml || (echo "Error: pubspec.yaml not found in $(pwd)" && exit 1)

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate clean Android project
        shell: bash
        run: |
          rm -rf android
          flutter create --platforms=android --org com.kibur --project-name bingo_et .
          rm -f test/widget_test.dart

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android_flutter/build/app/outputs/flutter-apk/app-release.apk
